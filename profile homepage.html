<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한송아 Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #bfe0f7;
      --blue-deep: #7fb8e3;
      --yellow: #fff1b8;
      --yellow-deep: #f5d76e;
      --pink: #ffd6e3;
      --pink-deep: #f59ab8;
      --text: #4a4a5a;
      --card: #ffffffd9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Gowun Dodum', sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: #cfe9fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 배경 동그라미 장식 */
    .bubble {
      position: fixed;
      border-radius: 50%;
      opacity: .55;
      z-index: 0;
    }
    .b1 { width: 220px; height: 220px; background: #ffffff; top: -60px; left: -60px; }
    .b2 { width: 160px; height: 160px; background: var(--blue); bottom: 40px; right: -40px; }
    .b3 { width: 100px; height: 100px; background: #ffffff; top: 20%; right: 10%; opacity: .35; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card);
      backdrop-filter: blur(6px);
      border-radius: 32px;
      box-shadow: 0 18px 40px rgba(100, 170, 220, .18);
      padding: 48px 32px 40px;
      text-align: center;
    }

    .avatar-wrap {
      width: 190px;
      height: 190px;
      margin: 0 auto 24px;
      border-radius: 50%;
      padding: 6px;
      background: transparent;
      animation: float 4s ease-in-out infinite;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .greeting {
      font-size: 1.05rem;
      color: #7a7a8c;
      margin-bottom: 32px;
    }

    .section-title {
      display: inline-block;
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      padding: 6px 20px;
      border-radius: 999px;
      background: #ffd8bf;
      margin-bottom: 18px;
    }

    .info {
      list-style: none;
      display: grid;
      gap: 14px;
      text-align: left;
    }
    .info li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 20px;
      transition: transform .2s ease;
    }
    .info li:hover { transform: translateY(-3px); }
    .info li:nth-child(1) { background: var(--yellow); }
    .info li:nth-child(2) { background: var(--pink); }
    .info li:nth-child(3) { background: #e6dcf7; }

    .icon {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
    }
    .label {
      display: block;
      font-size: .85rem;
      color: #8a8a9c;
    }
    .value {
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
    }

    footer {
      margin-top: 32px;
      font-size: .85rem;
      color: #9a9aac;
    }

    @media (max-width: 420px) {
      .card { padding: 36px 20px 32px; }
      .avatar-wrap { width: 150px; height: 150px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
